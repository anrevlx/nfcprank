<!--
  КУДА КЛАСТЬ ЭТОТ ФАЙЛ:
  В КОРЕНЬ репозитория, файл называется index.html
  (то есть просто заменить твой текущий index.html в корне на этот)
  Это страница-жертва — та, что открывается по ссылке из NFC-метки.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Посмотри мем</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s ease; cursor: pointer; }
        img:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <img id="memeImg" src="meme.jpg" alt="Мем">

    <script>
        // ==== ВСТАВЬ СВОИ ДАННЫЕ ====
        const USER = 'anrevlx';
        const REPO = 'nfcprank';
        const BRANCH = 'main';
        // ============================

        const img = document.getElementById('memeImg');
        let audioCtx = null;
        let audioBuffer = null;
        let currentSource = null;
        let unlocked = false;
        let lastTs = 0;

        // Разблокировка звука по тапу: по-настоящему "прогреваем" AudioContext
        // и загружаем звук в память. После этого браузер разрешает запускать
        // его позже без нового тапа — в отличие от обычного <audio>.
        img.addEventListener('click', async () => {
            if (unlocked) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const response = await fetch('sound.mp3');
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                await audioCtx.resume();
                unlocked = true;
            } catch(e) {}
        });

        function playSound() {
            if (!audioCtx || !audioBuffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopSound();
            currentSource = audioCtx.createBufferSource();
            currentSource.buffer = audioBuffer;
            currentSource.loop = true;
            currentSource.connect(audioCtx.destination);
            currentSource.start(0);
        }

        function stopSound() {
            if (currentSource) {
                try { currentSource.stop(); } catch(e) {}
                currentSource = null;
            }
        }

        // Проверка сигнала
        async function checkSignal() {
            try {
                const url = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/signal.json?t=${Date.now()}`;
                const r = await fetch(url, { cache: 'no-store' });
                const data = await r.json();
                if (data.ts !== lastTs) {
                    lastTs = data.ts;
                    if (data.play === true) {
                        playSound();
                        if (navigator.vibrate) {
                            navigator.vibrate([300, 100, 300, 100, 300, 100, 600]);
                        }
                    } else {
                        stopSound();
                        if (navigator.vibrate) navigator.vibrate(0);
                    }
                }
            } catch(e) {}
        }

        setInterval(checkSignal, 1000);

        // Стоп при сворачивании вкладки / блокировке
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopSound();
                if (navigator.vibrate) navigator.vibrate(0);
            }
        });
    </script>
</body>
</html>
